[package]
name = "featheraudio-capi"
version = "0.1.0"
edition = "2021"
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
description = "C API for featheraudio (static or shared library, header in include/featheraudio.h)"
repository = "https://github.com/mooyax/featheraudio"
publish = false

[lib]
name = "featheraudio"
crate-type = ["staticlib", "cdylib"]

[features]
default = ["tracker", "ogg", "mp3", "effects"]
# fa_audio_create(): output to the default device through cpal (desktop). Mobile apps
# leave it out and call fa_audio_render from their own audio callback.
cpal = ["featheraudio/cpal"]
tracker = ["featheraudio/tracker"]
mod = ["featheraudio/mod"]
it = ["featheraudio/it"]
xm = ["featheraudio/xm"]
ogg = ["featheraudio/ogg"]
mp3 = ["featheraudio/mp3"]
effects = ["featheraudio/effects"]

[dependencies]
featheraudio = { path = "..", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
