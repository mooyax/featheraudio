<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>featheraudio — AudioWorklet test</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; margin: 2rem; max-width: 40rem; }
  button { font: inherit; padding: .5rem 1rem; margin: .2rem; }
  #log { font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; background: #f4f4f4; padding: .8rem; border-radius: 6px; }
  .pass { color: #2a7a2a; } .fail { color: #b02020; }
</style>
<h1>featheraudio in an AudioWorklet</h1>
<p>Press Start, then try the sounds (headphones for 3D). The self-test runs first and prints PASS or FAIL.</p>
<button id="start">Start</button>
<button id="beep" disabled>Beep</button>
<button id="car" disabled>Car passes (3D)</button>
<button id="song" disabled>Tracker, once</button>
<button id="music" disabled>OGG music loop</button>
<div id="status"></div>
<div id="log"></div>
<script src="featheraudio.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const log = (s, cls) => { console.log(s); const d = document.createElement("div"); d.textContent = s; if (cls) d.className = cls; $("log").append(d); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let fa, ctx, src = {};

function tone(freq, secs, rate) {
  const n = Math.round(secs * rate), s = new Float32Array(n);
  for (let i = 0; i < n; i++) s[i] = 0.4 * Math.sin(2 * Math.PI * freq * i / rate) * Math.min(1, (n - i) / 500);
  return s;
}

async function start() {
  $("start").disabled = true;
  ctx = new AudioContext();
  log(`AudioContext: ${ctx.state}, ${ctx.sampleRate} Hz`);
  await Promise.race([ctx.resume(), sleep(3000)]);
  log(`AudioContext: ${ctx.state}`);
  fa = await FeatherAudio.create(ctx);
  fa.node.connect(ctx.destination);
  log(`engine started in the AudioWorklet, ${fa.sampleRate()} Hz`);
  const fail = (why) => { log("WORKLET_TEST FAIL " + why, "fail"); };
  try {
    const rate = ctx.sampleRate;
    src.beep = fa.fromSamples(tone(660, 0.3, rate), 1, rate);
    // an AudioBuffer, as from an OfflineAudioContext
    const buf = ctx.createBuffer(1, rate, rate);
    let saw = 0;
    buf.getChannelData(0).forEach((_, i, d) => { saw = (i * 110 / rate) % 1; d[i] = (saw * 2 - 1) * 0.3; });
    src.engine = fa.fromAudioBuffer(buf);
    const bytes = async (f) => (await fetch(f)).arrayBuffer();
    src.ogg = fa.load(await bytes("stereo.ogg"));
    src.oggStream = fa.stream(await bytes("stereo.ogg"));
    src.song = fa.load(await bytes("loop-end.mod"));
    src.broken = fa.load(new Uint8Array([1, 2, 3, 4]));
    let srcErr = null;
    fa.onSourceError = (id, m) => { srcErr = [id, m]; };

    const t0 = fa.time();
    const hBeep = fa.play(src.beep, { volume: 0.3 });
    const hCar = fa.play(src.engine, { loop: true, volume: 0.3, position: [-5, 0, -2], velocity: [10, 0, 0] });
    const hOgg = fa.play(src.ogg, { volume: 0.3 });
    const hSong = fa.play(src.song, { volume: 0.3 });
    await sleep(200);
    const voices = fa.activeVoices();
    log(`voices after 0.2 s: ${voices}`);
    await sleep(500);
    const t1 = fa.time();
    log(`clock ${t0.toFixed(2)} → ${t1.toFixed(2)} s; beep ${fa.isPlaying(hBeep) ? "still playing" : "ended"}, car ${fa.isPlaying(hCar) ? "playing" : "stopped"}`);
    if (!(t1 - t0 > 0.5)) return fail("the clock did not move");
    if (voices < 4) return fail(`only ${voices} of 4 voices`);
    if (fa.isPlaying(hBeep)) return fail("a 0.3 s beep still playing after 0.7 s");
    if (!fa.isPlaying(hCar)) return fail("the looping car stopped");
    if (!srcErr || srcErr[0] !== src.broken) return fail("no error for a broken file");
    log(`broken file reported: ${srcErr[1]}`);
    fa.stop(hCar);
    // the tracker song plays once: 4.8 s from its start (0.7 s have gone by)
    await sleep(3600);
    if (!fa.isPlaying(hSong)) return fail("the song ended too early");
    await sleep(1000);
    if (fa.isPlaying(hSong)) return fail("the song did not end (it should play once)");
    log("tracker song ended by itself after about 4.8 s");
    // buses and effects
    const music = fa.createBus();
    fa.setFilter(fa.bus(music), 0, FeatherAudio.FilterKind.LowPass, 500);
    const hm = fa.play(src.oggStream, { bus: music, loop: true, volume: 0.2 });
    await sleep(300);
    if (!fa.isPlaying(hm)) return fail("streamed music on a bus did not play");
    fa.stop(hm);
    log(`WORKLET_TEST PASS rate=${fa.sampleRate()}`, "pass");
  } catch (e) {
    fail(String(e && e.stack || e));
  }
  for (const b of ["beep", "car", "song", "music"]) $(b).disabled = false;
  setInterval(() => $("status").textContent = `voices ${fa.activeVoices()} · clock ${fa.time().toFixed(1)} s`, 200);
}

$("start").onclick = start;
$("beep").onclick = () => fa.play(src.beep, { speed: 0.8 + Math.random() * 0.5, pan: Math.random() * 1.6 - 0.8 });
$("car").onclick = () => {
  let x = -60;
  const h = fa.play(src.engine, { loop: true, position: [x, 0, -5], velocity: [25, 0, 0], minDistance: 2 });
  const t = setInterval(() => { x += 25 * 0.05; fa.setPosition(h, [x, 0, -5]); if (x > 60) { fa.stop(h); clearInterval(t); } }, 50);
};
$("song").onclick = () => fa.play(src.song);
let musicH = 0;
$("music").onclick = () => { if (musicH && fa.isPlaying(musicH)) { fa.stop(musicH); musicH = 0; } else musicH = fa.play(src.oggStream, { loop: true }); };
if (location.search.includes("auto")) start();
</script>
